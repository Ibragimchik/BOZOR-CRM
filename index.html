    if (p <= 1) return `${total} ${tr("pcs")}`;
    const bCnt = Math.floor(total / p);

    return `${total} ${tr("pcs")} (${bCnt} ${tr("box")}${rem > 0 ? " " + rem + " " + tr("pcs") : ""})`;
};

// Mavjud bir xil nomli tovarlarni avtomatik birlashtirish (Dublikatlarni yo'qotish):
function deduplicateAllLots() {
    if (!S.lots || S.lots.length < 2) return;
    const map = new Map();
    const keep = [];
    S.lots.forEach(l => {
        if (l.status === "transit") { keep.push(l); return; }
        const key = (l.name || "").trim().toLowerCase();
        if (!key) { keep.push(l); return; }
        if (!map.has(key)) {
            l.totalPcs = tot(l);
            map.set(key, l);
            keep.push(l);
        } else {
            const main = map.get(key);
            const addQ = tot(l);
            main.totalPcs = tot(main) + addQ;
            if (l.per > 0) main.per = l.per;
            main.boxes = Math.floor(main.totalPcs / (main.per || 1));
            main.extraPcs = main.totalPcs % (main.per || 1);
            main.buy = (+main.buy || 0) + (+l.buy || 0);
            if (l.exp && l.exp.length) main.exp = (main.exp || []).concat(l.exp);
            if (l.pRet > 0) main.pRet = l.pRet;
            if (l.pOpt > 0) main.pOpt = l.pOpt;
            if (l.pBox > 0) main.pBox = l.pBox;
            if (l.bc && !main.bc) main.bc = l.bc;
            if (l.img && !main.img) main.img = l.img;
            // O'tkazmalar va sotuvlarni asosiy tovarga o'tkazamiz:
            (S.moves || []).forEach(m => { if (m.lot == l.id) m.lot = main.id; });
            (S.sales || []).forEach(s => { if (s.lot == l.id) s.lot = main.id; });
        }
    });
    S.lots = keep;
}

async function loadFromSupabase() {
    if (!supabaseClient) return;
    try {
        S.brand.shopId = "417281";
        const targetShopId = "417281";
        const params = new URLSearchParams(location.search);
        const urlUser = params.get("u");

        const { data, error } = await supabaseClient
            .from('crm_state')
            .select('data')
            .eq('shop_id', targetShopId)
            .maybeSingle();

        if (!error && data && data.data) {
            const cloudData = data.data;
            // Agar bulutda ma'lumot bo'lsa, uni olamiz:
            S = Object.assign(S, cloudData);
            S.brand.shopId = "417281";
            deduplicateAllLots();
            try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
            _cloudLoadedOnce = true;
            _syncStateText = "☁️ Bazaga ulangan ✓";
            _syncStateColor = "#10b981";
            if (urlUser) {
                const autoU = (S.users || []).find(x => x.id === urlUser);
                if (autoU) {
                    history.replaceState({}, "", location.pathname);
                    finishAuth(autoU);
                    return;
                }
            }
            render();
        } else if (!error && !data) {
            _cloudLoadedOnce = true;
        }
    } catch (e) {
        _syncStateText = "⚠️ Internet aloqasi yo'q!";
        _syncStateColor = "#ef4444";
    }
}

const inLoc = (l, locId) => {
    if (l.status === "transit") return 0;
    const whs = S.locs.filter(x => x.type === "wh");
    let startWh = l.initWh || (whs[0] ? whs[0].id : "wh1");
    if (!S.locs.some(x => x.id === startWh) && whs.length > 0) {
        startWh = whs[0].id;
        l.initWh = startWh;
    }
    let q = (locId === startWh) ? tot(l) : 0;
    S.moves.forEach(m => {
        if (m.lot != l.id) return;
        const fromId = m.from || startWh;
        const toId   = m.to || "mk1";
        if (fromId === locId) q -= (+m.q || 0);
        if (toId === locId)   q += (+m.q || 0);
    });
    q -= sold(l, locId);
    return Math.max(0, q);
};

const inWh = (l, whId) => {
    if (l.status === "transit") return 0;
    const whs = S.locs.filter(x => x.type === "wh");
    if (whId && whId !== "all") return inLoc(l, whId);
    return whs.reduce((acc, w) => acc + inLoc(l, w.id), 0);
};

const inMk = (l, mkId) => {
    if (l.status === "transit") return 0;
    const mks = S.locs.filter(x => x.type === "mk");
    if (mkId && mkId !== "all") {
        const locObj = S.locs.find(x => x.id == mkId);
        if (locObj && locObj.type === "wh") return 0;
        return inLoc(l, mkId);
    }
    return mks.reduce((acc, m) => acc + inLoc(l, m.id), 0);
};

const getStars = l => {

    const ratio = s / t;
    if (s === 0) return 0;
    if (ratio >= 0.7 || s >= 50) return 5;
    if (ratio >= 0.5 || s >= 30) return 4;
    if (ratio >= 0.3 || s >= 15) return 3;
    if (ratio >= 0.12 || s >= 5) return 2;

};

function pr(l, q, mode) {
    if (mode === "box" || (l.pBox && q >= (l.per || 1) && mode !== "ret" && mode !== "opt")) return { p: l.pBox || l.pOpt || l.pRet, t: tr("prBox") };
    if (mode === "opt" || (l.pOpt && q >= (l.optMin || 3) && mode !== "ret")) return { p: l.pOpt, t: tr("prOpt") };

}

function calcWallets() {
    const locFilter = (role === "sel" && USER?.loc && USER.loc !== "all") ? USER.loc : (activeLoc !== "all" ? activeLoc : null);
    const salesList = S.sales.filter(s => !locFilter || s.loc == locFilter || (!s.loc && locFilter === "mk1"));
    let cashIn = 0, cardIn = 0, debtIn = 0;
    salesList.forEach(s => {
        if (s.pCash !== undefined || s.pCard !== undefined || s.pDebt !== undefined) {
            cashIn += (+s.pCash || 0);
            cardIn += (+s.pCard || 0);
            debtIn += (+s.pDebt || 0);
        } else cashIn += (+s.tot || 0);
    });
    (S.co || []).forEach(c => {
        cashIn += (+c.paidCash || 0);
        cardIn += (+c.paidCard || 0);
    });
    const expCash = sum((S.mexp || []).filter(e => e.w !== "card"), "amt");
    const expCard = sum((S.mexp || []).filter(e => e.w === "card"), "amt");
    const handCash = sum((S.hand || []).filter(h => h.w !== "card"), "amt");
    const handCard = sum((S.hand || []).filter(h => h.w === "card"), "amt");
    const totalCustDebt = (S.co || []).reduce((acc, c) => acc + Math.max(0, (+c.debt||0) - (+c.paidCash||0) - (+c.paidCard||0)), 0);
    const totalSupDebt  = (S.sups || []).reduce((acc, sp) => acc + Math.max(0, +sp.debtUZS || 0), 0);

    return {
        rev: sum(salesList, "tot"),
        cashBal: cashIn - expCash - handCash,
        cardBal: cardIn - expCard - handCard,
        debtBal: totalCustDebt,
        supDebt: totalSupDebt,
        handTot: handCash + handCard,
        expTot: expCash + expCard
    };
}

    addItemToBuyCart() {
        saveBuyPrefs();
        const nm = $("nm")?.value.trim();
        const bx = val("bxn"), pc = val("pc");
        let totPcs = val("bTotPcs");
        if (totPcs <= 0 && bx > 0 && pc > 0) totPcs = bx * pc;
        const pr = val("bUnitP");

        if (!nm || totPcs <= 0 || pr <= 0) {
            if (!nm && $("nm")) $("nm").classList.add("input-err");
            if (totPcs <= 0) {
                if ($("bxn")) $("bxn").classList.add("input-err");
                if ($("bTotPcs")) $("bTotPcs").classList.add("input-err");
            }
            if (pr <= 0 && $("bUnitP")) $("bUnitP").classList.add("input-err");
            return fail("Tovar nomi, jami dona (yoki karobka) va xarid narxini to'liq kiriting!");
        }

        const effectivePer = pc > 0 ? pc : totPcs;
        const effectiveBx  = pc > 0 ? Math.floor(totPcs / pc) : 1;
        const totCur = Math.round(totPcs * pr * 100) / 100;

        // Agar buyCart ichida ham xuddi shu nomli tovar bo'lsa, birlashtiramiz:
        const existInCart = buyCart.find(x => x.name.toLowerCase() === nm.toLowerCase() && x.buyUnitCur === pr);
        if (existInCart) {
            existInCart.totalPcs += totPcs;
            existInCart.boxes = Math.floor(existInCart.totalPcs / (existInCart.per || 1));
            existInCart.totCur = Math.round((existInCart.totCur + totCur) * 100) / 100;
        } else {
            buyCart.push({
                name: nm, bc: $("bc")?.value.trim() || "", img: tmpBuyImg || "",
                boxes: effectiveBx, per: effectivePer, totalPcs: totPcs, buyUnitCur: pr, totCur, cur: buyPrefs.cur
            });
        }

        tmpBuyImg = "";
        render();
        setTimeout(() => { if ($("nm")) $("nm").focus(); }, 30);
    },

    saveWholeBuyBatch() {
        saveBuyPrefs();
        if (!buyCart.length) return fail("Avval tovarlarni roʻyxatga qoʻshing!");

        const cur = buyPrefs.cur;
        const rt = S.rate[cur] || 1;

        let supObj = null;
        if ($("supSel").value === "new") {
            const sName = $("supNew").value.trim() || "Zavod";
            supObj = { id: uid(), name: sName, type: "sup", debtUZS: 0, payments: [] };
            S.sups.push(supObj);
            buyPrefs.supId = supObj.id;
        } else supObj = S.sups.find(x => x.id == $("supSel").value);

        let totalSupCur = 0;
        buyCart.forEach(it => { totalSupCur += it.totCur; });
        const totalSupUZS = totalSupCur * rt;

        if (supObj && totalSupUZS > 0) supObj.debtUZS = (+supObj.debtUZS || 0) + totalSupUZS;

        const mRet = buyPrefs.mRet;
        const mOpt = buyPrefs.mOpt;
        const mBox = buyPrefs.mBox;
        const om   = buyPrefs.om;

        const batchId = uid();
        const lotIds = [];

        buyCart.forEach(it => {
            const lid = uid();
            lotIds.push(lid);
            const itemRt = S.rate[it.cur || cur] || rt;
            const buyUZS = it.totCur * itemRt;
            const totPcs = it.totalPcs || (it.boxes * it.per);
            const unitCostUZS = buyUZS / Math.max(1, totPcs);
            const pRet = Math.round(unitCostUZS * (1 + mRet / 100));
            const pOpt = Math.round(unitCostUZS * (1 + mOpt / 100));
            const pBox = Math.round(unitCostUZS * (1 + mBox / 100));

            S.lots.push({
                id: lid, batchId, status: "transit",
                name: it.name, bc: it.bc, img: it.img,
                supId: supObj ? supObj.id : "",
                supName: supObj ? supObj.name : "", cargoId: "", cargoName: "",
                kg: 0, initWh: "wh1",
                boxes: it.boxes, per: it.per, extraPcs: totPcs % (it.per || 1), totalPcs: totPcs, buy: buyUZS,
                mRet, mOpt, mBox,
                exp: [],
                pRet, pOpt, optMin: om, pBox, promo: 0
            });
        });

        S.batches.push({
            id: batchId,
            supId: supObj ? supObj.id : "",
            supName: supObj ? supObj.name : "",
            t: Date.now(),
            cur, rt,
            totCur: Math.round(totalSupCur * 100) / 100,
            totUZS: totalSupUZS,
            status: "transit",
            cargoId: "", cargoName: "", totalKg: 0, cargoCostUZS: 0,
            lotIds,
            items: buyCart.map(x => Object.assign({}, x))
        });

        buyCart = [];
        if (supObj) {
            activePartnerId = supObj.id;
            openBatchId = batchId;
        }
        OK = "✅ Tovarlar «Sotib olindi» (Yoʻlda)! Endi kargodan kelganda qabul qilsangiz, mavjud tovar ustiga avtomatik qoʻshiladi.";
        save(); render();
    },

    cat() {
        const av = S.lots.filter(l => inMk(l, null) > 0);
        const cartTot = (S.cart || []).reduce((a, c) => {
            const l = L(c.lot);
            return a + (l ? c.q * pr(l, c.q, "auto").p : 0);
        }, 0);

        return `<div class="pos-wrap">
            <div class="c">
                <h3><span>${tr("catTitle")}</span><span class="badge">${av.length}</span></h3>

                    ${av.map(l => {
                        const rem = inMk(l, null);
                        const stars = getStars(l);
                        return `<div class="pos-card">
                            <div>
                                ${l.img ? `<img class="pi" src="${esc(l.img)}">` : `<div class="pi">👟</div>`}
                                <div style="font-weight:800;font-size:.95rem">${esc(l.name)} ${l.promo?`<span class="badge badge-tp">-${l.promo}%</span>`:""}</div>
                                <div style="font-size:.75rem">${stars>0?"⭐".repeat(stars):""}</div>
                                <div class="mu" style="font-size:.76rem">${tr("inMkCol")}: <b>${bx(l, rem)}</b></div>
                                <div class="mu" style="font-size:.76rem">${tr("prRet")}: <b>${f(l.pRet)}</b> | ${tr("prOpt")} (${l.optMin||5}+): <b>${f(l.pOpt||l.pRet)}</b></div>
                            </div>
                            <div style="margin-top:8px">
                                <div class="row" style="margin-bottom:6px">
                                    <input id="cq_${l.id}" type="number" value="1" min="1" max="${rem}" style="padding:6px">
                                </div>
                                <button class="b b-sm" style="width:100%" onclick="addCart('${l.id}')">${tr("addToCart")}</button>
                            </div>
                        </div>`;
                    }).join("")}
                </div>` : `<p class="mu">${tr("noProd")}</p>`}
            </div>

            <div class="c">
                <h3>${tr("cartTitle")}</h3>
                ${(S.cart && S.cart.length) ? `
                    <div class="tw"><table>
                        <tr><th>${tr("prodName")}</th><th>${tr("pcs")}</th><th class="r">${tr("amt")}</th><th></th></tr>
                        ${S.cart.map((c, idx) => {
                            const l = L(c.lot);
                            if (!l) return "";
                            const unitP = pr(l, c.q, "auto").p;
                            return `<tr>
                                <td><b>${esc(l.name)}</b></td>
                                <td>${c.q} ${tr("pcs")}</td>
                                <td class="r">${f(c.q * unitP)} ${S.cur}</td>
                                <td class="r"><button class="x" onclick="S.cart.splice(${idx},1);save();render()">×</button></td>
                            </tr>`;
                        }).join("")}
                    </table></div>
                    <div class="c" style="background:var(--bg);padding:10px;margin:8px 0">
                        <div class="mu">${tr("finalSum")}:</div>
                        <div class="big" style="color:var(--ac)">${f(cartTot)} <small>${S.cur}</small></div>
                    </div>
                    <label>${tr("note")} / ${tr("phone")}<input id="ordNote" value="${esc(USER?.login||'')}" placeholder="+996..."></label>
                    <button class="b b-ok" style="width:100%;margin-top:8px" onclick="submitOrder()">${tr("sendOrd")}</button>
                ` : `<p class="mu">${tr("emptyCart")}</p>`}

                <h3 style="margin-top:18px">${tr("myOrds")}</h3>
                ${(S.ord || []).length ? `<div class="tw"><table>
                    <tr><th>ID</th><th>${tr("amt")}</th><th>Status</th><th class="r">${tr("time")}</th></tr>
                    ${S.ord.slice().reverse().map(o => `<tr>
                        <td><b>#${o.id.slice(-4)}</b><br><span class="mu">${esc(o.custName)}</span></td>
                        <td><b>${f(o.tot)} ${S.cur}</b></td>
                        <td><span class="badge ${o.status==='sent'?'badge-ok':(o.status==='paid'?'badge-tp':'')}">${o.status==='sent'?tr("ordSent"):(o.status==='paid'?tr("ordPaid"):tr("ordWait"))}</span></td>
                        <td class="r mu">${tm(o.t)}</td>
                    </tr>`).join("")}
                </table></div>` : `<p class="mu">${tr("noOrds")}</p>`}
            </div>
        </div>`;

    ord() {
        const list = (S.ord || []).slice().reverse();
        return `<div class="c"><h3>${tr("ordTitle")}</h3>
        ${list.length ? list.map(o => {
            const itemsTxt = (o.items || []).map(it => {
                const l = L(it.lot);
                return `${esc(l?l.name:"Tovar")} (${it.q} ${tr("pcs")})`;
            }).join(", ");
            const isConfirmed = o.status === "paid" || o.status === "sent";

                    <span>📦 #${o.id.slice(-4)} — <b>${esc(o.custName)}</b> (${esc(o.phone||"")})</span>

                        <label>${tr("paidCardLbl")}<input id="ok_${o.id}" type="number" value="${o.pCard||0}" oninput="calcOrdRem('${o.id}',${o.tot})"></label>
                        <label>${tr("remDebtLbl")}<input id="od_${o.id}" type="number" readonly value="${o.pDebt||0}"></label>

                    <div class="row" style="margin-top:8px">
                        <button class="b b-tp" onclick="confirmOrdPay('${o.id}')">${tr("confirmPay")}</button>
                        <button class="b b-ok" ${!isConfirmed?'disabled':''} onclick="shipOrder('${o.id}')">${tr("sendProdBtn")}</button>
                    </div>
                ` : `<div class="mu">💵 ${tr("paidCashLbl")}: <b>${f(o.pCash)}</b> | 💳 ${tr("paidCardLbl")}: <b>${f(o.pCard)}</b> | 📒 ${tr("remDebtLbl")}: <b>${f(o.pDebt)}</b></div>`}
            </div>`;

            ${S.sales.slice(-10).reverse().map(s => {
                const l = L(s.lot);
                const pInfo = s.pDebt > 0 ? tr("debtPay") : (s.pCard > 0 && s.pCash > 0 ? tr("mixPay") : (s.pCard > 0 ? tr("cardPay") : tr("cashPay")));
                return `<tr><td><b>${esc(l?l.name:"Tovar")}</b></td><td class="mu">${esc(s.custName||"-")}</td><td>${s.q} ${tr("pcs")}</td><td><b>${f(s.tot)} ${S.cur}</b></td><td><span class="badge">${pInfo}</span></td><td class="r mu">${tm(s.t)} ${role==="boss"?`<button class="x" onclick="delSale('${s.id}')">×</button>`:""}</td></tr>`;

    debt() {
        // Barcha mijozlardan olingan qarz to'lovlari tarixi:
        const allCustPays = [];
        (S.co || []).forEach(c => {
            (c.payHist || []).forEach(p => {
                allCustPays.push({
                    custId: c.id,
                    custName: c.name,
                    t: p.t,
                    amt: p.amt,
                    rem: p.rem,
                    w: p.w,
                    by: p.by
                });
            });
        });
        allCustPays.sort((a, b) => b.t - a.t);

        return `<div class="g2">
            <div class="c">
                <h3>${tr("addCustTitle")}</h3>

                        </select>
                    </label>
                    <label>${tr("lastSales")}<select id="retSale">${S.sales.slice(-20).reverse().map(s=>{const l=L(s.lot);return `<option value="${s.id}">${esc(l?l.name:"Tovar")} — ${s.q} ${tr("pcs")} (${f(s.tot)} ${S.cur})</option>`;}).join("")}</select></label>
                    <div class="row">
                        ${num("retQ",tr("retQty"),"1")}

                            <select id="retWallet">
                                <option value="cash">💵 Naqd kassadan qaytarish</option>
                                <option value="card">💳 Kartadan qaytarish</option>
                                <option value="debt">📒 Nasiya qarzidan ayirish</option>
                            </select>
                        </label>
                    </div>

            ${(S.co||[]).length ? `<div class="tw"><table><tr><th>${tr("fullName")}</th><th>${tr("remDebt")}</th><th>${tr("payMethod")}</th></tr>

                return `<tr>
                    <td><b>${esc(c.name)}</b><br><span class="mu">${esc(c.phone||"")}</span></td>
                    <td><b style="color:${rem>0?'var(--bad)':'var(--ok)'}">${f(rem)} ${S.cur}</b></td>

            ${allCustPays.length ? `<div class="tw" style="max-height:280px;overflow-y:auto"><table>
                <tr><th>Sana / Vaqt</th><th>Xaridor (Mijoz)</th><th>Toʻlangan summa</th><th>Qolgan qarzi</th><th>Usul</th><th>Qabul qildi</th></tr>
                ${allCustPays.slice(0, 50).map(p => `<tr>
                    <td class="mu">${tm(p.t)}</td>
                    <td><b style="cursor:pointer;color:var(--ac)" onclick="openCustHistory('${p.custId}')">👤 ${esc(p.custName)}</b></td>
                    <td><b style="color:var(--ok)">+${f(p.amt)} ${S.cur}</b></td>
                    <td><b style="color:#eab308">${f(p.rem)} ${S.cur}</b></td>
                    <td><span class="badge">${p.w==='card'?tr("cardPay"):tr("cashPay")}</span></td>
                    <td class="mu">${esc(p.by || "-")}</td>
                </tr>`).join("")}
            </table></div>` : `<p class="mu">Hali xaridorlardan qarz toʻlovi qabul qilinmagan.</p>`}

async function login() {
    const l = ($("lg")?.value || "").trim().toLowerCase();
    const selRole = $("lgRole")?.value || "";
    const p = ($("pw")?.value || "").trim();

    if (!_cloudLoadedOnce && supabaseClient) {
        await loadFromSupabase();
    }

    const checkUser = (usersArr) => (usersArr || []).find(x => {
        const matchName = (x.name || "").toLowerCase() === l;
        const matchLogin = (x.login || "").toLowerCase() === l;
        const matchRole = !selRole || x.role === selRole;
        return (matchName || matchLogin) && matchRole && x.pw == p;
    });

    let u = checkUser(S.users);

    if (!u) {
        if ($("lg")) $("lg").classList.add("input-err");
        if ($("pw")) $("pw").classList.add("input-err");
        ERR = "Login, Ism yoki Rol va PIN xato! Ma'lumotlarni to'g'ri kiriting.";
        renderLogin();
        return;
    }
    finishAuth(u);
}
function sendResetCodeEmail() {
    const q = ($("fgLg")?.value || "").trim().toLowerCase();
    if (!q) { if ($("fgLg")) $("fgLg").classList.add("input-err"); return fail("Telefon raqam yoki pochtani kiriting!"); }
    OK = `✅ Tasdiqlash kodi va xabar ${q} manziliga joʻnatildi!`;

}
function resetForgotPw() {
    const q = ($("fgLg")?.value || "").trim().toLowerCase();
    const np = ($("fgNewPw")?.value || "").trim();
    if (!q || !np) {
        if ($("fgLg")) $("fgLg").classList.add("input-err");
        if ($("fgNewPw")) $("fgNewPw").classList.add("input-err");
        ERR = "Login/Pochta va yangi PIN-kodni kiriting!";
        renderLogin();
        return;
    }
    const u = S.users.find(x => (x.login||"").toLowerCase() === q || (x.name||"").toLowerCase() === q || (x.email||"").toLowerCase() === q);
    if (!u) { ERR = "Bunday foydalanuvchi topilmadi!"; renderLogin(); return; }
    u.pw = np;
    OK = `✅ Parol muvaffaqiyatli yangilandi!`;
    save();
    finishAuth(u);
}

function importBackupFile(input) {
    const file = input.files && input.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = e => {
        try {
            const parsed = JSON.parse(e.target.result);
            if (parsed && parsed.lots) {
                S = Object.assign(S, parsed);
                S.brand.shopId = "417281";
                save(); render();
                alert("✅ Zaxira fayli muvaffaqiyatli tiklandi!");
            }
        } catch (err) { alert("Fayl xato!"); }
    };
    r.readAsText(file);
}

        const navEl = document.querySelector(".wrap > nav");
        if (navEl) {
            errEl = document.createElement("div");
            errEl.className = "err";

    }
    if (errEl) {
        errEl.textContent = m;
        errEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } else {
        alert(m);
    }
    ERR = "";
    const firstErrInput = document.querySelector(".input-err");
    if (firstErrInput) {
        firstErrInput.focus();
        firstErrInput.addEventListener("input", () => firstErrInput.classList.remove("input-err"), { once: true });
    }
    return false;
};

function autofillBuyLot(valStr) {
    const query = (valStr || "").toLowerCase().trim();
    const hintEl = $("buyMatchHint");
    if (!query) { if (hintEl) hintEl.style.display = "none"; return; }
    const found = S.lots.find(l => (l.name || "").toLowerCase() === query);
    if (found) {
        if ($("bc") && found.bc) $("bc").value = found.bc;
        if ($("pc") && (+$("pc").value === 0) && found.per > 0) $("pc").value = found.per;
        if (hintEl) {
            hintEl.style.display = "block";
            hintEl.textContent = `✅ Bazada «${found.name}» mavjud (Hozir: ${tot(found)} dona). Yangi partiya kargodan qabul qilinganda shu tovarning ustiga qoʻshiladi!`;
        }
    } else if (hintEl) {
        hintEl.style.display = "none";
    }
}

function autofillWhLot(valStr) {
    const query = (valStr || "").toLowerCase().trim();
    const hintEl = $("whMatchHint");
    if (!query) { if (hintEl) hintEl.style.display = "none"; return; }
    const found = S.lots.find(l => l.status !== "transit" && (l.name || "").toLowerCase() === query);
    if (found) {
        const rt = curRate();
        if ($("dwBc")) $("dwBc").value = found.bc || "";
        if ($("dwWh") && found.initWh && S.locs.some(x => x.id === found.initWh)) {
            $("dwWh").value = found.initWh;
        }
        if ($("dwPc") && (+$("dwPc").value === 0) && found.per > 0) {
            $("dwPc").value = found.per;
        }
        if ($("dwCost")) $("dwCost").value = Math.round((unit(found) / rt) * 100) / 100;
        if ($("dwPRet")) $("dwPRet").value = found.pRet ? Math.round((found.pRet / rt) * 100) / 100 : "";
        if ($("dwPOpt")) $("dwPOpt").value = found.pOpt ? Math.round((found.pOpt / rt) * 100) / 100 : "";
        if ($("dwPBox")) $("dwPBox").value = found.pBox ? Math.round((found.pBox / rt) * 100) / 100 : "";
        if ($("dwOptMin")) $("dwOptMin").value = found.optMin || buyPrefs.om;
        if (hintEl && !editingLotId) {
            hintEl.style.display = "block";
            hintEl.textContent = `✅ Bazada «${found.name}» mavjud (Jami qoldiq: ${inWh(found,null)+inMk(found,null)} dona). Kiritayotgan donangiz shu tovar ustiga qoʻshiladi!`;
        }
    } else if (hintEl) {
        hintEl.style.display = "none";
    }
}

// Kargodan tovar kelganda: Agar skladda shu nomli tovar bo'lsa, ikkita qilmasdan ustiga qo'shish!
function receiveSingleLotCargo(batchId, lotId) {
    const b = (S.batches || []).find(x => x.id == batchId);
    const l = L(lotId);
    if (!l) return;

    const cgId = $("lCg_" + lotId)?.value;
    const whs = S.locs.filter(x => x.type === "wh");
    const whId = $("lWh_" + lotId)?.value || (whs[0] ? whs[0].id : "wh1");
    const kg = val("lKg_" + lotId);
    const cCur = $("lCur_" + lotId)?.value || buyPrefs.cargoCur || "USD";
    buyPrefs.cargoCur = cCur;
    localStorage.setItem(KEY + "-cargoCur", cCur);

    const cargoCostCur = val("lCost_" + lotId);
    const rt = S.rate[cCur] || 1;
    const cargoCostUZS = cargoCostCur * rt;

    const cgObj = (S.sups || []).find(x => x.id == cgId);
    if (cgObj && cargoCostUZS > 0) {
        cgObj.debtUZS = (+cgObj.debtUZS || 0) + cargoCostUZS;
    }

    l.status = "ready";
    l.initWh = whId;
    l.cargoId = cgObj ? cgObj.id : "";
    l.cargoName = cgObj ? cgObj.name : "Kargo";
    l.kg = kg;
    l.cargoOrigTxt = `${cargoCostCur} ${cCur}`;
    l.exp = cargoCostUZS > 0 ? [{ label: `${l.cargoName} (${kg} kg, ${cargoCostCur} ${cCur})`, amt: cargoCostUZS }] : [];

    const incomingPcs = tot(l);
    const uCost = unit(l);
    const mR = l.mRet || buyPrefs.mRet || 25;
    const mO = l.mOpt || buyPrefs.mOpt || 15;
    const mB = l.mBox || buyPrefs.mBox || 10;
    l.pRet = Math.round(uCost * (1 + mR / 100));
    l.pOpt = Math.round(uCost * (1 + mO / 100));
    l.pBox = Math.round(uCost * (1 + mB / 100));

    // Tekshiramiz: Skladda xuddi shu nomli tayyor tovar bormi?
    const cleanName = (l.name || "").trim().toLowerCase();
    const existReady = S.lots.find(x => x.id !== l.id && x.status !== "transit" && (x.name || "").trim().toLowerCase() === cleanName);

    if (existReady) {
        const oldTotalPcs = tot(existReady);
        const combinedPcs = oldTotalPcs + incomingPcs;
        const newPer = l.per > 0 ? l.per : (existReady.per || 1);

        existReady.totalPcs = combinedPcs;
        existReady.per = newPer;
        existReady.boxes = Math.floor(combinedPcs / newPer);
        existReady.extraPcs = combinedPcs % newPer;
        existReady.buy = (+existReady.buy || 0) + (+l.buy || 0);
        existReady.exp = (existReady.exp || []).concat(l.exp || []);
        existReady.kg = (+existReady.kg || 0) + kg;
        existReady.cargoName = l.cargoName;
        existReady.cargoOrigTxt = l.cargoOrigTxt;

        // Yangi tannarx asosida sotish narxlarini yangilaymiz:
        const mergedUnitCost = unit(existReady);
        existReady.pRet = Math.round(mergedUnitCost * (1 + mR / 100));
        existReady.pOpt = Math.round(mergedUnitCost * (1 + mO / 100));
        existReady.pBox = Math.round(mergedUnitCost * (1 + mB / 100));

        // Partiya ichidagi lotId ni mavjud tovarga bog'lab, vaqtinchalik lotni o'chiramiz:
        if (b && b.lotIds) {
            b.lotIds = b.lotIds.map(id => id === l.id ? existReady.id : id);
        }
        S.lots = S.lots.filter(x => x.id !== l.id);
    }

    if (b) {
        b.cargoId = l.cargoId;
        b.cargoName = l.cargoName;
        b.totalKg = (+b.totalKg || 0) + kg;
        b.cargoCostUZS = (+b.cargoCostUZS || 0) + cargoCostUZS;
        const batchLots = (b.lotIds || []).map(id => L(id)).filter(Boolean);
        if (batchLots.every(x => x.status !== "transit")) b.status = "arrived";
    }

    OK = `✅ «${l.name}» (${incomingPcs} dona) Skladga qabul qilindi!`;
    save(); render();
}

function calcDirectWhPrices() {
    const costCur = val("dwCost");
    if (costCur <= 0) return;
    const mRStr = ($("dwMRet")?.value || "").trim();
    const mOStr = ($("dwMOpt")?.value || "").trim();
    const mBStr = ($("dwMBox")?.value || "").trim();

    if (mRStr !== "" && $("dwPRet")) {
        $("dwPRet").value = Math.round(costCur * (1 + (+mRStr) / 100) * 100) / 100;
    }
    if (mOStr !== "" && $("dwPOpt")) {
        $("dwPOpt").value = Math.round(costCur * (1 + (+mOStr) / 100) * 100) / 100;
    }
    if (mBStr !== "" && $("dwPBox")) {
        $("dwPBox").value = Math.round(costCur * (1 + (+mBStr) / 100) * 100) / 100;
    }
}

function saveDirectWhProduct(existingLotId) {
    const nm = $("dwNm")?.value.trim();
    const bxCnt = val("dwBx");
    const perBx = val("dwPc");
    let totPcs = val("dwExtraPcs");
    if (totPcs <= 0 && bxCnt > 0 && perBx > 0) {
        totPcs = bxCnt * perBx;
    }
    const costCur = val("dwCost");
    const whs = S.locs.filter(x => x.type === "wh");
    const selectedWh = $("dwWh")?.value || (whs[0] ? whs[0].id : "wh1");

    document.querySelectorAll(".input-err").forEach(el => el.classList.remove("input-err"));
    if (!nm || totPcs <= 0 || costCur <= 0) {
        if (!nm && $("dwNm")) $("dwNm").classList.add("input-err");
        if (totPcs <= 0) {
            if ($("dwBx")) $("dwBx").classList.add("input-err");
            if ($("dwExtraPcs")) $("dwExtraPcs").classList.add("input-err");
        }
        if (costCur <= 0 && $("dwCost")) $("dwCost").classList.add("input-err");
        return fail("Diqqat! Tovar nomi, Jami Dona va Tannarxni to'ldiring!");
    }
    const effectivePer = perBx > 0 ? perBx : totPcs;
    const effectiveBx  = Math.floor(totPcs / effectivePer);
    const remPcs       = totPcs % effectivePer;

    const rt = curRate();
    const totalBuyUZS = costCur * rt * totPcs;
    
    const rawPRet = val("dwPRet");
    const rawPOpt = val("dwPOpt");
    const rawPBox = val("dwPBox");

    const pRetUZS = (rawPRet > 0 ? rawPRet : costCur * 1.25) * rt;
    const pOptUZS = (rawPOpt > 0 ? rawPOpt : costCur * 1.15) * rt;
    const pBoxUZS = (rawPBox > 0 ? rawPBox : costCur * 1.1) * rt;

    if (existingLotId) {
        const l = L(existingLotId);
        if (l) {
            l.name = nm;
            l.bc = $("dwBc")?.value.trim() || l.bc;
            if (tmpWhImg) l.img = tmpWhImg;
            l.initWh = selectedWh;
            l.per = effectivePer;
            l.totalPcs = totPcs;
            l.boxes = effectiveBx;
            l.extraPcs = remPcs;
            l.buy = totalBuyUZS;
            l.pRet = Math.round(pRetUZS);
            l.pOpt = Math.round(pOptUZS);
            l.pBox = Math.round(pBoxUZS);
            l.optMin = val("dwOptMin") || 5;
        }
        editingLotId = null;
        OK = `✅ «${nm}» yangilandi (Jami: ${totPcs} dona)!`;
    } else {
        const cleanName = nm.toLowerCase();
        const existing = S.lots.find(x => x.status !== "transit" && (x.name || "").trim().toLowerCase() === cleanName);
        if (existing) {
            const oldTotPcs = tot(existing);
            const newPer = perBx > 0 ? perBx : (existing.per || 1);
            const combinedPcs = oldTotPcs + totPcs;
            
            existing.per = newPer;
            existing.totalPcs = combinedPcs;
            existing.boxes = Math.floor(combinedPcs / newPer);
            existing.extraPcs = combinedPcs % newPer;
            existing.buy = (+existing.buy || 0) + totalBuyUZS;
            
            if (!S.locs.some(x => x.id === existing.initWh)) {
                existing.initWh = selectedWh;
            }
            if (rawPRet > 0) existing.pRet = Math.round(pRetUZS);
            if (rawPOpt > 0) existing.pOpt = Math.round(pOptUZS);
            if (rawPBox > 0) existing.pBox = Math.round(pBoxUZS);
            if (val("dwOptMin") > 0) existing.optMin = val("dwOptMin");

            OK = `✅ «${nm}» mavjud tovar ustiga qo'shildi (+${totPcs} dona, jami: ${combinedPcs} dona)!`;
        } else {
            S.lots.push({
                id: uid(), status: "ready",
                name: nm, bc: $("dwBc")?.value.trim() || "", img: tmpWhImg || "",
                supName: "Mavjud zaxira", cargoName: "-",
                kg: 0, initWh: selectedWh,
                boxes: effectiveBx, per: effectivePer, extraPcs: remPcs, totalPcs: totPcs,
                mRet: val("dwMRet"), mOpt: val("dwMOpt"), mBox: val("dwMBox"),
                buy: totalBuyUZS, exp: [],
                pRet: Math.round(pRetUZS), pOpt: Math.round(pOptUZS), optMin: val("dwOptMin") || 5, pBox: Math.round(pBoxUZS), promo: 0
            });
            OK = `✅ «${nm}» (${totPcs} dona) Skladga saqlandi!`;
        }
    }

    tmpWhImg = "";
    showDirectWhAdd = false;
    save(); render();
}

let sMode = "auto", payType = "cash";
function pickPos(id) { selLotId = id; if ($("sl")) $("sl").value = id; document.querySelectorAll(".pos-card").forEach(c => c.classList.remove("sel")); upd(); }

function scanPosBarcode(code) {

const qty = () => { const l = L($("sl")?.value); return l ? [l, val("sb") * (l.per || 1) + val("sp")] : [null, 0]; };
function upd() {
    if (!$("sl")) return;
    const [l, q] = qty(); if (!l) return;
    const p = pr(l, q || 1, sMode);
    $("spr").value = f(p.p).replace(/\s/g, ""); 
    $("tier").textContent = p.t; 
    tot2();
}
function tot2() {
    if (!$("sl")) return;
    const [l, q] = qty(); if (!l) return;
    const finalTot = Math.max(0, (q * val("spr")) - val("sdisc"));
    if ($("stot")) $("stot").innerHTML = `${q} ${tr("pcs")} = ${finalTot} <small>${S.cur}</small>`;
}

function posAddToCart() {
    if ($("selCustId")) posSelectedCustId = $("selCustId").value;
    const [l, q] = qty(); 
    const rt = curRate();
    const p = val("spr") * rt; 
    const disc = val("sdisc") * rt;
    if (!l || q <= 0 || p <= 0) return fail(tr("pcs") + "!");
    
    const mks = S.locs.filter(x => x.type === "mk");
    const curShop = (role === "sel" && USER?.loc && USER.loc !== "all") ? USER.loc : (activeLoc !== "all" ? activeLoc : null);
    const rem = inMk(l, curShop);
    const alreadyInCart = posCart.reduce((a, c) => c.lot == l.id ? a + c.q : a, 0);
    if (q + alreadyInCart > rem) return fail(`${tr("inMkCol")} yetarli emas! Bor: ${rem} dona`);

    let targetLoc = curShop;
    if (!targetLoc) {
        const foundMk = mks.find(m => inLoc(l, m.id) >= (q + alreadyInCart)) || mks[0];
        targetLoc = foundMk ? foundMk.id : "mk1";
    }

    const finalTot = Math.max(0, q * p - disc);
    posCart.push({ lot: l.id, name: l.name, q, p, disc, tot: finalTot, loc: targetLoc });
    OK = "➕ " + l.name + ` (${q} dona)`; 
    render();
}

function sellMulti() {
    if (!posCart.length) {
        const [l, q] = qty();
        if (l && q > 0 && val("spr") > 0) {
            posAddToCart();
            if (!posCart.length) return;
        } else {
            return fail("Chek bo'sh! Avval tovarni ro'yxatga qo'shing.");
        }
    }
    if ($("selCustId")) posSelectedCustId = $("selCustId").value;
    const mks = S.locs.filter(x => x.type === "mk");
    const defaultShop = (role === "sel" && USER?.loc && USER.loc !== "all") ? USER.loc : (activeLoc !== "all" ? activeLoc : (mks[0] ? mks[0].id : "mk1"));
    const grandTot = posCart.reduce((a, c) => a + c.tot, 0);
    const rt = curRate();
    let pCash = 0, pCard = 0, pDebt = 0;

    const custObj = S.co.find(x => x.id == posSelectedCustId);

    if (payType === "cash") pCash = grandTot;
    else if (payType === "card") pCard = grandTot;
    else if (payType === "mix") {
        pCash = val("pCashIn") * rt; 
        pCard = val("pCardIn") * rt;
        if (Math.abs((pCash + pCard) - grandTot) > 10) return fail("Naqd + Karta summasi yakuniy summaga teng emas!");
    } else if (payType === "debt") {
        pDebt = grandTot;
        if (custObj) custObj.debt = (+custObj.debt || 0) + grandTot;
        else return fail(tr("custSelect") + "!");
    }

    posCart.forEach((item, idx) => {
        const isFirst = idx === 0;
        S.sales.push({
            id: uid(), lot: item.lot, q: item.q, p: item.p, disc: item.disc, tot: item.tot,
            custId: custObj ? custObj.id : "", custName: custObj ? custObj.name : "",
            pCash: isFirst ? pCash : 0, pCard: isFirst ? pCard : 0, pDebt: isFirst ? pDebt : 0,
            loc: item.loc || defaultShop, by: role, t: Date.now()
        });
    });

    posCart = [];
    posSelectedCustId = "";
    if ($("selCustId")) $("selCustId").value = "";
    OK = `✅ Sotildi: ${f(grandTot)} ${S.cur} ${custObj ? '(' + custObj.name + ')' : ''}`;
    save(); render();
}

let html5QrScanner = null;
function openScanner(targetInputId) {
    const m = $("scanModal");
    if (!m) return;
    m.classList.add("show");
    if (typeof Html5Qrcode === "undefined") {
        const manual = prompt("Shtrix-kodni kiriting:");
        if (manual && $(targetInputId)) {
            $(targetInputId).value = manual;
            if (targetInputId === "posQ") scanPosBarcode(manual);
            if (targetInputId === "dwNm") autofillWhLot(manual);
        }
        stopScanner();
        return;
    }
    try {
        html5QrScanner = new Html5Qrcode("scanReader");
        html5QrScanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 240, height: 120 } },
            (decodedText) => {
                if ($(targetInputId)) {
                    $(targetInputId).value = decodedText;
                    if (targetInputId === "posQ") scanPosBarcode(decodedText);
                    if (targetInputId === "dwNm") autofillWhLot(decodedText);
                }
                stopScanner();
            },
            () => {}
        ).catch(() => {});
    } catch (e) {}
}
function stopScanner() {
    const m = $("scanModal");
    if (m) m.classList.remove("show");
    if (html5QrScanner) {
        try { html5QrScanner.stop().then(() => html5QrScanner.clear()).catch(() => {}); } catch (e) {}
        html5QrScanner = null;
    }
}

function addCart(lotId) {
    const l = L(lotId); if (!l) return;
    const q = Math.max(1, +($("cq_" + lotId)?.value) || 1);
    const rem = inMk(l, null);
    if (q > rem) return fail(tr("inMkCol") + ": " + rem);
    const ex = S.cart.find(x => x.lot == lotId);
    if (ex) ex.q = Math.min(rem, ex.q + q); else S.cart.push({ lot: lotId, q });
    OK = "🧺 + " + l.name; save(); render();
}
function submitOrder() {
    if (!S.cart || !S.cart.length) return;
    let totSum = 0;
    const items = S.cart.map(c => {
        const l = L(c.lot); const p = l ? pr(l, c.q, "auto").p : 0;
        totSum += c.q * p; return { lot: c.lot, q: c.q, p };
    });
    S.ord.push({
        id: uid(), custId: USER?.id || "", custName: USER?.name || "Xaridor",
        phone: $("ordNote")?.value.trim() || USER?.login || "",
        items, tot: totSum, pCash: totSum, pCard: 0, pDebt: 0, status: "wait", t: Date.now()
    });
    S.cart = []; OK = "🚀 " + tr("sendOrd"); save(); render();
}
function calcOrdRem(ordId, totSum) {
    const c = val("oc_" + ordId), k = val("ok_" + ordId);
    if ($("od_" + ordId)) $("od_" + ordId).value = Math.max(0, totSum - c - k);
}
function confirmOrdPay(ordId) {
    const o = S.ord.find(x => x.id == ordId); if (!o) return;
    o.pCash = val("oc_" + ordId); o.pCard = val("ok_" + ordId);
    o.pDebt = Math.max(0, o.tot - o.pCash - o.pCard); o.status = "paid";

function makeReturn() {
    const sId = $("retSale")?.value, rq = val("retQ");
    const custId = $("retCust")?.value;
    const wallet = $("retWallet")?.value || "cash";
    const s = S.sales.find(x => x.id == sId);
    if (!s || rq <= 0 || rq > s.q) return fail(tr("retQty") + "!");

    const unitPrice = s.tot / s.q;
    const returnTot = Math.round(rq * unitPrice);

    s.q -= rq; s.tot = Math.round(s.q * unitPrice);
    if (s.q === 0) S.sales = S.sales.filter(x => x.id != sId);

    if (wallet === "debt" && custId) {
        const c = S.co.find(x => x.id == custId);
        if (c) c.debt = Math.max(0, (+c.debt || 0) - returnTot);
    } else {
        S.mexp.push({ id: uid(), label: `Vozvrat #${sId.slice(-4)}`, amt: returnTot, w: wallet, t: Date.now() });
    }

    OK = `🔄 Vozvrat bajarildi: -${f(returnTot)} ${S.cur}`; save(); render();
}

document.addEventListener("keydown", function(e) {
    const el = document.activeElement;
    if (!el || !["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName)) return;

    const card = el.closest(".c, .modal-c") || document.body;
    const inputs = Array.from(card.querySelectorAll("input:not([type=hidden]):not([type=file]):not([disabled]):not([readonly]), select:not([disabled])"))
        .filter(x => x.offsetParent !== null);
    const idx = inputs.indexOf(el);

    if (e.key === "ArrowDown") {
        e.preventDefault();
        if (idx >= 0 && idx < inputs.length - 1) { inputs[idx + 1].focus(); if (inputs[idx + 1].select) inputs[idx + 1].select(); }
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (idx > 0) { inputs[idx - 1].focus(); if (inputs[idx - 1].select) inputs[idx - 1].select(); }
    } else if (e.key === "ArrowRight") {
        const isAtEnd = (el.tagName === "SELECT" || el.type === "number" || el.selectionStart === null || el.selectionStart === (el.value || "").length);
        if (isAtEnd && idx >= 0 && idx < inputs.length - 1) {
            e.preventDefault();
            inputs[idx + 1].focus();
            if (inputs[idx + 1].select) inputs[idx + 1].select();
        }
    } else if (e.key === "ArrowLeft") {
        const isAtStart = (el.tagName === "SELECT" || el.type === "number" || el.selectionStart === null || el.selectionStart === 0);
        if (isAtStart && idx > 0) {
            e.preventDefault();
            inputs[idx - 1].focus();
            if (inputs[idx - 1].select) inputs[idx - 1].select();
        }
    } else if (e.key === "Enter") {
        if (el.id === "posQ" || el.id === "dwNm" || el.id === "nm") return;
        e.preventDefault();
        if (idx >= 0 && idx < inputs.length - 1) {
            inputs[idx + 1].focus();
            if (inputs[idx + 1].select) inputs[idx + 1].select();
        } else {
            const btn = card.querySelector("button.b:not(.b-out):not(.b-bad)") || card.querySelector("button.b");
            if (btn) btn.click();
        }
    }
});

async function _flushToCloud() {
    if (!supabaseClient) return;
    if (_syncBusy) { _syncPending = true; return; }
    _syncBusy = true;
    _syncPending = false;

    try {
        const targetShopId = "417281";
        S.brand.shopId = targetShopId;

        // HIMOYA QULFI: Agar hozirgi qurilmada tovarlar 0 ta bo'lsa yoki hali bulut o'qilmagan bo'lsa, avval bazani tekshiramiz!
        if (!_cloudLoadedOnce || !S.lots || S.lots.length === 0) {
            const { data: chk } = await supabaseClient
                .from('crm_state')
                .select('data')
                .eq('shop_id', targetShopId)
                .maybeSingle();
            if (chk && chk.data && chk.data.lots && chk.data.lots.length > (S.lots ? S.lots.length : 0)) {
                S = Object.assign(S, chk.data);
                S.brand.shopId = targetShopId;
                deduplicateAllLots();
                try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
                _cloudLoadedOnce = true;
                render();
                _syncBusy = false;
                return;
            }
            _cloudLoadedOnce = true;
        }

        S._ver = Date.now();
        _lastPushTime = S._ver;

        showSyncStatus("⏳ Bazaga saqlanmoqda...", false);

        const { error } = await supabaseClient
            .from('crm_state')
            .upsert({
                shop_id: targetShopId,
                data: S,
                updated_at: new Date().toISOString()
            }, { onConflict: 'shop_id' });

        // Ehtiyot zaxira qatori (417281_backup):
        if (!error && S.lots && S.lots.length > 0) {
            await supabaseClient.from('crm_state').upsert({
                shop_id: targetShopId + "_backup",
                data: S,
                updated_at: new Date().toISOString()
            }, { onConflict: 'shop_id' });
        }

        if (error) {
            showSyncStatus("⚠️ XATO: Bazaga saqlanmadi! (" + (error.message || "Internetni tekshiring") + ")", true);
            setTimeout(_flushToCloud, 3000);
        } else {
            showSyncStatus("☁️ Bazaga saqlandi ✓", false);
        }
    } catch (e) {
        showSyncStatus("⚠️ XATO: Internet uzildi! Saqlanmadi!", true);
        setTimeout(_flushToCloud, 3000);
    } finally {
        _syncBusy = false;
        if (_syncPending) _flushToCloud();
    }
}

    if (!supabaseClient || window._rtActive) return;

    const targetShopId = "417281";

        .on('postgres_changes', { event: '*', schema: 'public', table: 'crm_state', filter: `shop_id=eq.${targetShopId}` }, payload => {

function compressImgDataUrl(dataUrl, cb) {
    const img = new Image();
    img.onload = () => {
        const cv = document.createElement("canvas");
        const max = 240;
        const sc = Math.min(max / img.width, max / img.height, 1);
        cv.width = img.width * sc;
        cv.height = img.height * sc;
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL("image/jpeg", 0.65));
    };
    img.src = dataUrl;
}
function uploadBuyImg(input) {
    const file = input.files && input.files[0]; if (!file) return;
    const r = new FileReader(); r.onload = e => compressImgDataUrl(e.target.result, res => { tmpBuyImg = res; }); r.readAsDataURL(file);
}

}

function getCustCurrentRemDebt(c) {
    if (!c) return 0;
    return Math.max(0, (+c.debt || 0) - (+c.paidCash || 0) - (+c.paidCard || 0));
}

function getCustGroupedHistory(cid) {
    const c = (S.co || []).find(x => x.id == cid);
    if (!c) return { c: null, groups: [] };
    const rawSales = (S.sales || []).filter(s => s.custId == c.id || (c.name && s.custName === c.name));
    const groups = [];
    rawSales.forEach(s => {
        let g = groups.find(x => Math.abs(x.t - s.t) <= 5000);
        if (!g) {
            g = { id: s.id, t: s.t, items: [], tot: 0, debt: 0, paid: 0 };
            groups.push(g);
        }
        g.items.push(s);
        g.tot += (+s.tot || 0);
        g.debt += (+s.pDebt || 0);
        g.paid += (+s.pCash || 0) + (+s.pCard || 0);
    });

    let runningDebt = 0;
    groups.forEach(g => {
        const actualPaid = g.debt > 0 ? Math.max(0, g.tot - g.debt) : g.tot;
        g.oldDebt = runningDebt;
        g.checkRem = g.tot - actualPaid;
        g.paidAmt = actualPaid;
        runningDebt = runningDebt + g.checkRem;
        g.finalDebt = runningDebt;
    });

    return { c, groups: groups.reverse() };
}

function editCustSaleItem(saleId) {
    if (role !== "boss") return;
    const s = S.sales.find(x => x.id == saleId); if (!s) return;
    const l = L(s.lot);
    const rt = curRate();
    const curPrice = Math.round((s.p / rt) * 100) / 100;
    const newQStr = prompt(`${l ? l.name : "Tovar"} — Yangi sonini kiriting (${tr("pcs")}):`, s.q);
    if (newQStr === null) return;
    const newPStr = prompt(`1 ${tr("pcs")} narxini kiriting (${S.cur}):`, curPrice);
    if (newPStr === null) return;

    const nq = Math.max(1, +newQStr || s.q);
    const np = Math.max(0, (+newPStr || curPrice) * rt);
    const oldTot = +s.tot || 0;
    const newTot = Math.round(nq * np - (+s.disc || 0));
    const diff = newTot - oldTot;

    s.q = nq; s.p = np; s.tot = newTot;
    if (s.pDebt > 0 || s.custId) {
        const c = S.co.find(x => x.id == s.custId || x.name === s.custName);
        if (c && s.pDebt > 0) {
            s.pDebt = Math.max(0, (+s.pDebt || 0) + diff);
            c.debt = Math.max(0, (+c.debt || 0) + diff);
        } else if (s.pCash > 0) s.pCash = Math.max(0, (+s.pCash || 0) + diff);
    }
    save(); render();
}

function delCustSaleItem(saleId) {
    if (role !== "boss") return;
    const s = S.sales.find(x => x.id == saleId); if (!s) return;
    const l = L(s.lot);
    if (!confirm(`«${l ? l.name : "Tovar"}» (${s.q} ${tr("pcs")}) ni mijoz ro'yxatidan o'chirib, do'konga qaytarasizmi?`)) return;
    if (s.custId || s.custName) {
        const c = S.co.find(x => x.id == s.custId || x.name === s.custName);
        if (c && s.pDebt > 0) c.debt = Math.max(0, (+c.debt || 0) - (+s.tot || 0));
    }
    S.sales = S.sales.filter(x => x.id != saleId);
    save(); render();
}

                <tr><th>${ti("date")}</th><th>${ti("oldim")}</th><th>${ti("kaldi")}</th><th>${ti("by")}</th></tr>
                ${pays.map(p => `<tr>
                    <td class="mu">${tm(p.t)}</td>
                    <td><b style="color:#10b981">+${f(p.amt)} ${S.cur}</b></td>
                    <td><b style="color:#eab308">${f(p.rem)} ${S.cur}</b></td>
                    <td>${esc(p.by || "-")}</td>
                </tr>`).join("")}
            </table></div>` : `<p class="mu">${ti("noPays")}</p>`}
        </div>
    </div>`;
}

// 7. SAHIFA CHIZILGANDA (RENDER) AVTOMATIK RAVISHDA BARCHA YANGI FUNKSIYALARNI ULAB BERISH
if (typeof render === "function" && !window._renderHooked) {
    window._renderHooked = true;
    const _origRender = render;
    render = function() {
        _origRender();

        // A) O'tkazma bo'limida: Harf yozib qidirish + Xo'jayin uchun "O'tkazmani o'chirish" tugmasi:
        const tlSel = $("tl");
        if (tlSel && !$("trfQuickSearch")) {
            const inp = document.createElement("input");
            inp.id = "trfQuickSearch";
            inp.placeholder = "🔍 Harflarni yozib qidiring (masalan: GED K)...";
            inp.value = window.trfFilterText || "";
            inp.style.marginBottom = "8px";
            inp.style.border = "1px solid var(--ac)";
            inp.oninput = function() { filterTrfSelect(this.value); };
            tlSel.parentNode.insertBefore(inp, tlSel);
            if (window.trfFilterText) filterTrfSelect(window.trfFilterText);
        }
        if (tab === "trf" && role === "boss" && S.moves.length) {
            const tables = document.querySelectorAll(".wrap table");
            const mvTable = tables[tables.length - 1];
            if (mvTable && !mvTable.dataset.delAdded) {
                mvTable.dataset.delAdded = "1";
                const recentMoves = S.moves.slice(-12).reverse();
                const rows = mvTable.querySelectorAll("tr");
                rows.forEach((r, idx) => {
                    if (idx === 0) return;
                    const mvObj = recentMoves[idx - 1];
                    const lastTd = r.querySelector("td:last-child");
                    if (mvObj && lastTd) {
                        lastTd.insertAdjacentHTML("beforeend", ` <button class="x" title="O'tkazmani bekor qilish" onclick="delMoveRecord('${mvObj.id}')">🗑️</button>`);
                    }
                });
            }
        }

        // B) Sotuv (POS) bo'limiga "🖨️ Pechat" tugmasini qo'shish:
        const sellBtn = document.querySelector("button[onclick*='sellMulti']");
        if (sellBtn && !$("posPrintBtn")) {
            const pBtn = document.createElement("button");
            pBtn.id = "posPrintBtn";
            pBtn.className = "b b-out";
            pBtn.style.marginTop = "8px";
            pBtn.style.width = "100%";
            pBtn.innerHTML = "🖨️ " + ti("print");
            pBtn.onclick = printLastSaleCheck;
            sellBtn.insertAdjacentElement("afterend", pBtn);
        }

        // C) Mijoz va Nasiya bo'limida mijoz ismini bosiladigan qilish:
        if (tab === "debt" && S.co && S.co.length) {
            const tables = document.querySelectorAll(".wrap table");
            const debtTable = tables[0];
            if (debtTable) {
                debtTable.querySelectorAll("tr").forEach(trEl => {
                    const firstTd = trEl.querySelector("td");
                    if (!firstTd || firstTd.dataset.custLinked) return;
                    const tdText = firstTd.innerText || "";
                    const matchedCust = S.co.find(c => c.name && tdText.includes(c.name));
                    if (matchedCust) {
                        firstTd.dataset.custLinked = "1";
                        firstTd.style.cursor = "pointer";
                        firstTd.onclick = () => openCustHistory(matchedCust.id);
                        const bTag = firstTd.querySelector("b") || firstTd;
                        bTag.style.color = "#38bdf8";
                        bTag.style.textDecoration = "underline";
                        firstTd.insertAdjacentHTML("beforeend", ` <span class="badge badge-ok" style="cursor:pointer;margin-left:6px">📋 ${ti("list")} / 🖨️ ${ti("print")}</span>`);
                    }
                });
            }
        }

        // D) Sklad bo'limida: Ro'yxatni yig'ish/ochish tugmasi + Sklad Tarixi jadvali:
        if (tab === "wh") {
            const cards = document.querySelectorAll(".wrap > .c");
            const mainWhCard = cards[1];
            if (mainWhCard && !mainWhCard.dataset.collapseAdded) {
                mainWhCard.dataset.collapseAdded = "1";
                const h3 = mainWhCard.querySelector("h3");
                if (h3) {
                    const toggleBtn = document.createElement("button");
                    toggleBtn.className = "b b-sm b-out";
                    toggleBtn.innerHTML = window.hideWhTable ? ti("showWh") : ti("hideWh");
                    toggleBtn.onclick = () => { window.hideWhTable = !window.hideWhTable; render(); };
                    h3.appendChild(toggleBtn);
                }
                if (window.hideWhTable) {
                    Array.from(mainWhCard.children).forEach(ch => {
                        if (ch.tagName !== "H3") ch.style.display = "none";
                    });
                }
            }

            if (!$("whAuditBox")) {
                const wrap = document.querySelector(".wrap");
                if (wrap) {
                    const logs = (S.whLogs || []).slice().reverse();
                    const div = document.createElement("div");
                    div.id = "whAuditBox";
                    div.className = "c";
                    div.style.marginTop = "16px";
                    div.innerHTML = `
                        <h3><span>📜 Sklad Tarixi (Kiritish, Tahrirlash va O'chirish)</span> <span class="badge">${logs.length}</span></h3>
                        ${logs.length ? `<div class="tw"><table>
                            <tr><th>${ti("date")}</th><th>Amal</th><th>${tr("prodName")}</th><th>Tafsilotlar</th><th>${ti("by")}</th></tr>
                            ${logs.slice(0, 60).map(lg => `<tr>
                                <td class="mu">${tm(lg.t)}</td>
                                <td><span class="badge ${lg.act.includes('Kiritildi')?'badge-ok':(lg.act.includes('O\'chirildi')?'badge-bad':'badge-tp')}">${esc(lg.act)}</span></td>
                                <td><b>${esc(lg.name)}</b></td>
                                <td>${esc(lg.det)}</td>
                                <td><b>${esc(lg.by)}</b></td>
                            </tr>`).join("")}
                        </table></div>` : `<p class="mu">Hozircha tarix bo'sh.</p>`}
                    `;
                    wrap.appendChild(div);
                }
            }
        }

        // E) Mijoz tarixi modal oynasini ekranga chiqarish:
        const oldModal = $("custHistModal");
        if (oldModal) oldModal.remove();
        if (window.activeCustHistoryId) {
            document.body.insertAdjacentHTML("beforeend", buildCustHistoryModal());
        }
    };
}

// Dastur ishga tushganda AVVAL bulutdan yuklaymiz, keyin ekranni chizamiz:
(async function initApp() {
    render();
    await loadFromSupabase();
})();
</script>
