async function syncToSupabase() {
    if (!supabaseClient) return;
    try {
        await supabaseClient.from('crm_state').upsert({
            shop_id: S.brand.shopId || "default",
            data: S,
            updated_at: new Date().toISOString()
        }, { onConflict: 'shop_id' });
    } catch (e) {}
}

async function loadFromSupabase() {
    if (!supabaseClient) return;
    try {
        const { data, error } = await supabaseClient
            .from('crm_state')
            .select('data')
            .eq('shop_id', S.brand.shopId || "default")
            .maybeSingle();
        if (!error && data && data.data) {
            S = Object.assign(S, data.data);
            localStorage.setItem(KEY, JSON.stringify(S));
            render();
        }
    } catch (e) {}
}

const L = id => S.lots.find(l => l.id == id);
const tot = l => (l.boxes * (l.per || 1)) + (+l.extraPcs || 0);
const cost = l => l.buy + sum(l.exp || [], "amt");
const unit = l => tot(l) > 0 ? cost(l) / tot(l) : 0;
const sold = (l, locId) => sum(S.sales.filter(s => s.lot == l.id && (!locId || s.loc == locId)), "q");

const inLoc = (l, locId) => {
    if (l.status === "transit") return 0;
    const startWh = l.initWh || "wh1";
    let q = (locId === startWh) ? tot(l) : 0;
    S.moves.forEach(m => {
        if (m.lot != l.id) return;
        const fromId = m.from || "wh1";
        const toId   = m.to || "mk1";
        if (fromId === locId) q -= (+m.q || 0);
        if (toId === locId)   q += (+m.q || 0);
    });
    q -= sold(l, locId);
    return Math.max(0, q);
};

const inWh = (l, whId) => {
    if (l.status === "transit") return 0;
    const whs = S.locs.filter(x => x.type === "wh");
    if (whId && whId !== "all") return inLoc(l, whId);
    return whs.reduce((acc, w) => acc + inLoc(l, w.id), 0);
};

const inMk = (l, mkId) => {
    if (l.status === "transit") return 0;
    const mks = S.locs.filter(x => x.type === "mk");
    if (mkId && mkId !== "all") {
        const locObj = S.locs.find(x => x.id == mkId);
        if (locObj && locObj.type === "wh") return 0;
        return inLoc(l, mkId);
    }
    return mks.reduce((acc, m) => acc + inLoc(l, m.id), 0);
};

const getStars = l => {
    const s = sold(l, null);
    const t = Math.max(1, tot(l));
    const ratio = s / t;
    if (s === 0) return 0;
    if (ratio >= 0.7 || s >= 50) return 5;
    if (ratio >= 0.5 || s >= 30) return 4;
    if (ratio >= 0.3 || s >= 15) return 3;
    if (ratio >= 0.12 || s >= 5) return 2;
    return 1;
};

    return ({
        boss: [["home",tr("home")],["buy",tr("buy")],["trf",tr("trf")],["wh",tr("wh")],["mk",tr("mk")],["ord",tr("ord")+ordBadge],["cat",tr("cat")],["cash",tr("cash")],["debt",tr("debt")],["staff",tr("staff")],["sub",tr("sub")],["prof",tr("prof")]],
        man:  [["trf",tr("trf")],["wh",tr("wh")],["mk",tr("mk")],["ord",tr("ord")+ordBadge],["cat",tr("cat")],["cash",tr("cash")],["debt",tr("debt")],["prof",tr("prof")]],
        sel:  [["mk",tr("mk")],["ord",tr("ord")+ordBadge],["cat",tr("cat")],["cash",tr("cash")],["debt",tr("debt")],["prof",tr("prof")]],
        cust: [["cat",tr("cat")],["prof",tr("prof")]]
    }[role] || [["cat",tr("cat")],["prof",tr("prof")]]);
};

function pr(l, q, mode) {
    if (mode === "box" || (l.pBox && q >= l.per && mode !== "ret" && mode !== "opt")) return { p: l.pBox ? Math.round(l.pBox / Math.max(1, l.per)) : l.pRet, t: tr("prBox") };
    if (mode === "opt" || (l.pOpt && q >= (l.optMin || 5) && mode !== "ret")) return { p: l.pOpt, t: tr("prOpt") };
    return { p: l.pRet, t: tr("prRet") };
}

const st = (a, v) => `<div class="c"><div class="mu">${a}</div><div class="big">${f(v)} <small>${S.cur}</small></div></div>`;
const num = (id, lb, ph, valStr, onInp) => `<label>${lb}<input id="${id}" type="number" step="any" inputmode="decimal" ${ph?`placeholder="${ph}"`:""} ${valStr!==undefined?`value="${valStr}"`:""} ${onInp?`oninput="${onInp}"`:""}></label>`;

function calcWallets() {
    const locFilter = (role === "sel" && USER?.loc && USER.loc !== "all") ? USER.loc : (activeLoc !== "all" ? activeLoc : null);
    const salesList = S.sales.filter(s => !locFilter || s.loc == locFilter || (!s.loc && locFilter === "mk1"));
    let cashIn = 0, cardIn = 0, debtIn = 0;
    salesList.forEach(s => {
        if (s.pCash !== undefined || s.pCard !== undefined || s.pDebt !== undefined) {
            cashIn += (+s.pCash || 0);
            cardIn += (+s.pCard || 0);
            debtIn += (+s.pDebt || 0);
        } else cashIn += (+s.tot || 0);
    });
    (S.co || []).forEach(c => {
        cashIn += (+c.paidCash || 0);
        cardIn += (+c.paidCard || 0);
    });
    const expCash = sum((S.mexp || []).filter(e => e.w !== "card"), "amt");
    const expCard = sum((S.mexp || []).filter(e => e.w === "card"), "amt");
    const handCash = sum((S.hand || []).filter(h => h.w !== "card"), "amt");
    const handCard = sum((S.hand || []).filter(h => h.w === "card"), "amt");
    const totalCustDebt = (S.co || []).reduce((acc, c) => acc + Math.max(0, (+c.debt||0) - (+c.paidCash||0) - (+c.paidCard||0)), 0);
    const totalSupDebt  = (S.sups || []).reduce((acc, sp) => acc + Math.max(0, +sp.debtUZS || 0), 0);

    return {
        rev: sum(salesList, "tot"),
        cashBal: cashIn - expCash - handCash,
        cardBal: cardIn - expCard - handCard,
        debtBal: totalCustDebt,
        supDebt: totalSupDebt,
        handTot: handCash + handCard,
        expTot: expCash + expCard
    };
}

            name: nm, bc: $("bc")?.value.trim() || "", img: tmpBuyImg || "",
            boxes: bx, per: pc, buyUnitCur: pr, totCur, cur: buyPrefs.cur
        });

        tmpBuyImg = "";
        render();
        setTimeout(() => { if ($("nm")) $("nm").focus(); }, 30);

    saveWholeBuyBatch() {
        saveBuyPrefs();
        if (!buyCart.length) { alert("Avval tovarlarni roʻyxatga qoʻshing!"); return; }

        const cur = buyPrefs.cur;
        const rt = S.rate[cur] || 1;

        let supObj = null;
        if ($("supSel").value === "new") {
            const sName = $("supNew").value.trim() || "Zavod";

            S.sups.push(supObj);
            buyPrefs.supId = supObj.id;
        } else supObj = S.sups.find(x => x.id == $("supSel").value);

        let totalSupCur = 0;
        buyCart.forEach(it => { totalSupCur += it.totCur; });
        const totalSupUZS = totalSupCur * rt;

        if (supObj && totalSupUZS > 0) supObj.debtUZS = (+supObj.debtUZS || 0) + totalSupUZS;

        const mRet = buyPrefs.mRet;
        const mOpt = buyPrefs.mOpt;
        const mBox = buyPrefs.mBox;
        const om   = buyPrefs.om;

        const batchId = uid();
        const lotIds = [];

        buyCart.forEach(it => {
            const lid = uid();
            lotIds.push(lid);
            const itemRt = S.rate[it.cur || cur] || rt;
            const buyUZS = it.totCur * itemRt;
            const unitCostUZS = buyUZS / (it.boxes * it.per);
            const pRet = Math.round(unitCostUZS * (1 + mRet / 100));
            const pOpt = Math.round(unitCostUZS * (1 + mOpt / 100));
            const pBox = Math.round(unitCostUZS * it.per * (1 + mBox / 100));

            S.lots.push({
                id: lid, batchId, status: "transit",
                name: it.name, bc: it.bc, img: it.img,
                supId: supObj ? supObj.id : "",
                supName: supObj ? supObj.name : "", cargoId: "", cargoName: "",
                kg: 0, initWh: "wh1",
                boxes: it.boxes, per: it.per, extraPcs: 0, buy: buyUZS,
                mRet, mOpt, mBox,
                exp: [],
                pRet, pOpt, optMin: om, pBox, promo: 0
            });
        });

        S.batches.push({
            id: batchId,
            supId: supObj ? supObj.id : "",
            supName: supObj ? supObj.name : "",
            t: Date.now(),
            cur, rt,
            totCur: Math.round(totalSupCur * 100) / 100,
            totUZS: totalSupUZS,
            status: "transit",
            cargoId: "", cargoName: "", totalKg: 0, cargoCostUZS: 0,
            lotIds,
            items: buyCart.map(x => Object.assign({}, x))
        });

        buyCart = [];
        if (supObj) {
            activePartnerId = supObj.id;
            openBatchId = batchId;
        }
        OK = "✅ Tovarlar «Sotib olindi» (Yoʻlda)! Endi har bir tovarga alohida kargo va yoʻlkira yozishingiz mumkin.";
        save(); render();

function login() {
    const l = $("lg").value.trim(), p = $("pw").value.trim();
    const u = S.users.find(x => x.login == l && x.pw == p);
    if (!u) { ERR = "Login / PIN xato! Agar unutgan boʻlsangiz «Men parolni unutdim» tugmasini bosing."; renderLogin(); return; }
    finishAuth(u);
}
function resetForgotPw() {
    const q = ($("fgLg")?.value || "").trim().toLowerCase();
    const np = ($("fgNewPw")?.value || "").trim();
    if (!q || !np) { ERR = "Login va yangi PIN-kodni kiriting!"; renderLogin(); return; }
    const u = S.users.find(x => (x.login||"").toLowerCase() === q || (x.name||"").toLowerCase() === q);
    if (!u) { ERR = "Bunday login yoki ismli foydalanuvchi topilmadi!"; renderLogin(); return; }
    u.pw = np;
    OK = `✅ Parol yangilandi! Login: ${u.login}`;
    save();
    finishAuth(u);
}
function bioLogin(uidStr) {
    const u = S.users.find(x => x.id == uidStr);
    if (u) finishAuth(u);
}
function finishAuth(u) {
    USER = u; role = u.role;
    u.lang = S.lang; u.cur = S.cur;
    activeLoc = (role === "sel" && USER?.loc && USER.loc !== "all") ? USER.loc : "all";
    try {
        localStorage.setItem(KEY + "-u", u.id);
        if (u.bio) localStorage.setItem(KEY + "-bio-u", u.id);
    } catch(e) {}
    save(); tab = getTabs()[0][0]; render();
}
function registerCustomerAuth() {
    const nm = $("cRegNm").value.trim(), lg = $("cRegLg").value.trim(), pw = $("cRegPw").value.trim() || "1234";
    if (!nm || !lg) { ERR = tr("fullName") + " & " + tr("phone") + "!"; renderLogin(); return; }
    const u = { id: uid(), name: nm, login: lg, pw, role: "cust", loc: "mk1", bio: true };
    S.users.push(u);
    if (!S.co.some(c => c.phone === lg)) S.co.push({ id: u.id, name: nm, phone: lg, debt: 0, paidCash: 0, paidCard: 0, t: Date.now() });
    finishAuth(u);
}
function registerCustomerInside() {
    const nm = $("ncNm").value.trim(), ph = $("ncPh").value.trim(), pw = $("ncPw").value.trim() || "1234";
    if (!nm || !ph) return fail(tr("fullName") + " & " + tr("phone"));
    const id = uid();
    S.co.push({ id, name: nm, phone: ph, debt: 0, paidCash: 0, paidCard: 0, t: Date.now() });
    S.users.push({ id, name: nm, login: ph, pw, role: "cust", loc: "mk1", bio: true });
    OK = "✅ " + nm; save(); render();
}
function registerBrand() {
    const br = $("rBrand").value.trim(), lg = $("rLogin").value.trim() || "boss", pw = $("rPw").value.trim() || "1234", nm = $("rName").value.trim() || "Boshliq";
    if (!br) { ERR = tr("locName") + "!"; renderLogin(); return; }
    S.brand = { name: br, logo: S.brand.logo, shopId: String(Math.floor(100000 + Math.random() * 900000)), promoBy: $("rPromo").value.trim() };
    let bossUser = S.users.find(u => u.role === "boss");
    if (bossUser) { bossUser.name = nm; bossUser.login = lg; bossUser.pw = pw; bossUser.bio = true; }
    else { bossUser = { id: "u0", name: nm, login: lg, pw, role: "boss", loc: "all", bio: true }; S.users.unshift(bossUser); }
    finishAuth(bossUser);
}
function logout() { USER = null; try { localStorage.removeItem(KEY + "-u"); } catch(e) {} renderLogin(); }

// HAR BIR TOVARNI ALOHIDA KARGO VA VALYUTA BILAN SKLADGA QABUL QILISH
function receiveSingleLotCargo(batchId, lotId) {
    const b = (S.batches || []).find(x => x.id == batchId);
    const l = L(lotId);
    if (!l) return;

    const cgId = $("lCg_" + lotId)?.value;
    const whId = $("lWh_" + lotId)?.value || "wh1";
    const kg = val("lKg_" + lotId);
    const cCur = $("lCur_" + lotId)?.value || buyPrefs.cargoCur || "USD";
    buyPrefs.cargoCur = cCur;
    localStorage.setItem(KEY + "-cargoCur", cCur);

    const cargoCostCur = val("lCost_" + lotId);
    const rt = S.rate[cCur] || 1;
    const cargoCostUZS = cargoCostCur * rt;

    const cgObj = (S.sups || []).find(x => x.id == cgId);
    if (cgObj && cargoCostUZS > 0) {

}

function calcDirectWhPrices() {
    const costCur = val("dwCost");
    if (costCur <= 0) return;
    const perBx = Math.max(1, val("dwPc") || 1);
    const mR = val("dwMRet"), mO = val("dwMOpt"), mB = val("dwMBox");
    if ($("dwPRet")) $("dwPRet").value = Math.round(costCur * (1 + mR / 100) * 100) / 100;
    if ($("dwPOpt")) $("dwPOpt").value = Math.round(costCur * (1 + mO / 100) * 100) / 100;
    if ($("dwPBox")) $("dwPBox").value = Math.round(costCur * perBx * (1 + mB / 100) * 100) / 100;
}

function addDirectWhProduct() {
    const nm = $("dwNm")?.value.trim();
    const bxCnt = val("dwBx");
    const perBx = val("dwPc");
    const extraPcs = val("dwExtraPcs");
    const costCur = val("dwCost");

    const totPcs = (bxCnt * (perBx || 1)) + extraPcs;
    if (!nm || totPcs <= 0 || costCur <= 0) {
        return fail("Tovar nomi, soni (karobka yoki donalik qoldiq) va kelgan narxini kiriting!");
    }

    const effectiveBoxes = bxCnt > 0 ? bxCnt : 0;
    const effectivePer   = perBx > 0 ? perBx : (extraPcs > 0 ? extraPcs : 1);

    const rt = curRate();
    const totalBuyUZS = costCur * rt * totPcs;
    const pRetUZS = (val("dwPRet") || costCur * 1.25) * rt;
    const pOptUZS = (val("dwPOpt") || costCur * 1.15) * rt;
    const pBoxUZS = (val("dwPBox") || costCur * effectivePer * 1.1) * rt;

    S.lots.push({
        id: uid(), status: "ready",
        name: nm, bc: $("dwBc")?.value.trim() || "", img: tmpWhImg || "",
        supName: "Mavjud zaxira", cargoName: "-",
        kg: 0, initWh: $("dwWh")?.value || "wh1",
        boxes: effectiveBoxes, per: effectivePer, extraPcs: bxCnt > 0 ? extraPcs : extraPcs,
        buy: totalBuyUZS, exp: [],
        pRet: Math.round(pRetUZS), pOpt: Math.round(pOptUZS), optMin: val("dwOptMin") || 5, pBox: Math.round(pBoxUZS), promo: 0
    });

    tmpWhImg = "";
    OK = `✅ «${nm}» (${totPcs} dona) Skladga saqlandi! Kataklar 0 ga tushirildi.`;
    save(); render();
    // Saqlangandan so'ng barcha raqam kataklarini 0 ga tushiramiz
    setTimeout(() => {
        ["dwBx","dwPc","dwExtraPcs","dwCost","dwPRet","dwPOpt","dwPBox"].forEach(id => { if ($(id)) $(id).value = "0"; });
        if ($("dwNm")) { $("dwNm").value = ""; $("dwNm").focus(); }
        if ($("dwBc")) $("dwBc").value = "";
    }, 30);
}

let sMode = "auto", payType = "cash";
function pickPos(id) { selLotId = id; if ($("sl")) $("sl").value = id; document.querySelectorAll(".pos-card").forEach(c => c.classList.remove("sel")); upd(); }
function filterPos() {
    const q = ($("posQ")?.value || "").toLowerCase().trim();
    document.querySelectorAll("#posGrid .pos-card").forEach(el => {
        el.style.display = (el.dataset.nm.includes(q) || el.dataset.bc.includes(q)) ? "flex" : "none";
    });
}
function scanPosBarcode(code) {
    const clean = (code || "").trim().toLowerCase();
    if (!clean) return;
    const curShop = (role === "sel" && USER?.loc && USER.loc !== "all") ? USER.loc : (activeLoc !== "all" ? activeLoc : null);
    const found = S.lots.find(l => inMk(l, curShop) > 0 && (l.bc || "").toLowerCase() === clean);
    if (found) {
        pickPos(found.id);
        posAddToCart();
        if ($("posQ")) $("posQ").value = "";
        filterPos();
    }
}
function setSMode(m, btn) {
    sMode = m;
    document.querySelectorAll("#sModeSeg button").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    if (m === "box" && (!val("sb") || val("sb") === 0)) { $("sb").value = 1; $("sp").value = 0; }
    if ($("custBoxPos")) $("custBoxPos").style.display = (sMode === "opt" || sMode === "box" || payType === "debt") ? "block" : "none";
    upd();
}
function setPayType(pt, btn) {
    payType = pt;
    document.querySelectorAll("#payTypeSeg button").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    if ($("mixBox")) $("mixBox").style.display = pt === "mix" ? "flex" : "none";
    if ($("custBoxPos")) $("custBoxPos").style.display = (sMode === "opt" || sMode === "box" || payType === "debt") ? "block" : "none";
}
const qty = () => { const l = L($("sl")?.value); return l ? [l, val("sb") * l.per + val("sp")] : [null, 0]; };
function upd() {
    if (!$("sl")) return;
    const [l, q] = qty(); if (!l) return;
    const p = pr(l, q || 1, sMode);
    $("spr").value = n(p.p); $("tier").textContent = p.t; tot2();
}
function tot2() {
    if (!$("sl")) return;
    const [l, q] = qty(); if (!l) return;
    const finalTot = Math.max(0, (q * val("spr")) - val("sdisc"));
    if ($("stot")) $("stot").innerHTML = `${q} ${tr("pcs")} = ${f(finalTot)} <small>${S.cur}</small>`;
}

function posAddToCart() {
    if ($("selCustId")) posSelectedCustId = $("selCustId").value;
    const [l, q] = qty(); const p = val("spr"), disc = val("sdisc");
    if (!l || q <= 0 || p <= 0) return fail(tr("pcs") + "!");
    const curShop = (role === "sel" && USER?.loc && USER.loc !== "all") ? USER.loc : (activeLoc !== "all" ? activeLoc : "mk1");
    const rem = inMk(l, curShop==="all"?null:curShop);
    const alreadyInCart = posCart.reduce((a, c) => c.lot == l.id ? a + c.q : a, 0);
    if (q + alreadyInCart > rem) return fail(tr("inMkCol") + " < " + (q + alreadyInCart));

    const finalTot = Math.max(0, q * p - disc);
    posCart.push({ lot: l.id, name: l.name, q, p, disc, tot: finalTot });
    OK = "➕ " + l.name; render();
}

function sellMulti() {
    if (!posCart.length) return fail("Chek bo'sh!");
    if ($("selCustId")) posSelectedCustId = $("selCustId").value;
    const curShop = (role === "sel" && USER?.loc && USER.loc !== "all") ? USER.loc : (activeLoc !== "all" ? activeLoc : "mk1");
    const grandTot = posCart.reduce((a, c) => a + c.tot, 0);
    let pCash = 0, pCard = 0, pDebt = 0;

    const custObj = S.co.find(x => x.id == posSelectedCustId);
    if ((sMode === "opt" || sMode === "box") && !custObj) {
        return fail("Optim / Karobka sotuv uchun roʻyxatdan mijozni tanlang!");
    }

    if (payType === "cash") pCash = grandTot;
    else if (payType === "card") pCard = grandTot;
    else if (payType === "mix") {
        pCash = val("pCashIn"); pCard = val("pCardIn");
        if (pCash + pCard !== grandTot) return fail("Cash + Card ≠ Total!");
    } else if (payType === "debt") {
        pDebt = grandTot;
        if (custObj) custObj.debt = (+custObj.debt || 0) + grandTot;
        else return fail(tr("custSelect") + "!");
    }

    posCart.forEach((item, idx) => {
        const isFirst = idx === 0;
        S.sales.push({
            id: uid(), lot: item.lot, q: item.q, p: item.p, disc: item.disc, tot: item.tot,
            custId: custObj ? custObj.id : "", custName: custObj ? custObj.name : "",
            pCash: isFirst ? pCash : 0, pCard: isFirst ? pCard : 0, pDebt: isFirst ? pDebt : 0,
            loc: curShop, by: role, t: Date.now()
        });
    });

    posCart = [];
    OK = `✅ ${f(grandTot)} ${S.cur} ${custObj ? '(' + custObj.name + ')' : ''}`;
    save(); render();
}

// KAMERA SHTRIX-KOD SKANERI FUNKSIYALARI
let html5QrScanner = null;
function openScanner(targetInputId) {
    const m = $("scanModal");
    if (!m) return;
    m.classList.add("show");
    if (typeof Html5Qrcode === "undefined") {
        const manual = prompt("Shtrix-kodni kiriting:");
        if (manual && $(targetInputId)) {
            $(targetInputId).value = manual;
            if (targetInputId === "posQ") scanPosBarcode(manual);
        }
        stopScanner();
        return;
    }
    try {
        html5QrScanner = new Html5Qrcode("scanReader");
        html5QrScanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 240, height: 120 } },
            (decodedText) => {
                if ($(targetInputId)) {
                    $(targetInputId).value = decodedText;
                    if (targetInputId === "posQ") scanPosBarcode(decodedText);
                }
                stopScanner();
            },
            () => {}
        ).catch(() => {});
    } catch (e) {}
}
function stopScanner() {
    const m = $("scanModal");
    if (m) m.classList.remove("show");
    if (html5QrScanner) {
        try { html5QrScanner.stop().then(() => html5QrScanner.clear()).catch(() => {}); } catch (e) {}
        html5QrScanner = null;
    }
}

function makeReturn() {
    const sId = $("retSale")?.value, rq = val("retQ");
    const custId = $("retCust")?.value;
    const wallet = $("retWallet")?.value || "cash";
    const s = S.sales.find(x => x.id == sId);
    if (!s || rq <= 0 || rq > s.q) return fail(tr("retQty") + "!");

    const unitPrice = s.tot / s.q;
    const returnTot = Math.round(rq * unitPrice);

    s.q -= rq; s.tot = Math.round(s.q * unitPrice);
    if (s.q === 0) S.sales = S.sales.filter(x => x.id != sId);

    if (wallet === "debt" && custId) {
        const c = S.co.find(x => x.id == custId);
        if (c) c.debt = Math.max(0, (+c.debt || 0) - returnTot);
    } else {
        S.mexp.push({ id: uid(), label: `Vozvrat #${sId.slice(-4)}`, amt: returnTot, w: wallet, t: Date.now() });
    }

    OK = `🔄 Vozvrat bajarildi: -${f(returnTot)} ${S.cur}`; save(); render();
}

document.addEventListener("keydown", function(e) {
    const el = document.activeElement;
    if (!el || !["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName)) return;

    const card = el.closest(".c, .modal-c") || document.body;
    const inputs = Array.from(card.querySelectorAll("input:not([type=hidden]):not([type=file]):not([disabled]):not([readonly]), select:not([disabled])"))
        .filter(x => x.offsetParent !== null);
    const idx = inputs.indexOf(el);

    if (e.key === "ArrowDown") {
        e.preventDefault();
        if (idx >= 0 && idx < inputs.length - 1) { inputs[idx + 1].focus(); if (inputs[idx + 1].select) inputs[idx + 1].select(); }
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (idx > 0) { inputs[idx - 1].focus(); if (inputs[idx - 1].select) inputs[idx - 1].select(); }
    } else if (e.key === "ArrowRight") {
        const isAtEnd = (el.tagName === "SELECT" || el.type === "number" || el.selectionStart === null || el.selectionStart === (el.value || "").length);
        if (isAtEnd && idx >= 0 && idx < inputs.length - 1) {
            e.preventDefault();
            inputs[idx + 1].focus();
            if (inputs[idx + 1].select) inputs[idx + 1].select();
        }
    } else if (e.key === "ArrowLeft") {
        const isAtStart = (el.tagName === "SELECT" || el.type === "number" || el.selectionStart === null || el.selectionStart === 0);
        if (isAtStart && idx > 0) {
            e.preventDefault();
            inputs[idx - 1].focus();
            if (inputs[idx - 1].select) inputs[idx - 1].select();
        }
    } else if (e.key === "Enter") {
        if (el.id === "posQ") return;
        e.preventDefault();
        if (idx >= 0 && idx < inputs.length - 1) {
            inputs[idx + 1].focus();
            if (inputs[idx + 1].select) inputs[idx + 1].select();
        } else {
            const btn = card.querySelector("button.b:not(.b-out):not(.b-bad)") || card.querySelector("button.b");
            if (btn) btn.click();
        }
    }
});

render();
loadFromSupabase();
</script>
